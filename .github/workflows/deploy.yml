name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Los documentos internos viven en el repo pero no se publican (2026-10-25, auditoría):
      # CONTENT-PLAN.md contaba en público cómo se arman las variantes por país, y los demás
      # describen el formulario, el correo y el diseño. llms.txt y robots.txt sí van.
      - name: Quitar documentos internos
        run: |
          find . -path ./.git -prune -o -name '*.md' -type f -print -delete
          rm -rf .github .claude .agents

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
