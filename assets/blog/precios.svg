<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
  <defs>
    <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a679ff"/>
      <stop offset="100%" stop-color="#8242f5"/>
    </linearGradient>
    <radialGradient id="m1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#efe8ff" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#efe8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="susurro">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="3" result="r"/>
      <feColorMatrix in="r" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".055"/></feComponentTransfer>
      <feComposite operator="in" in2="SourceGraphic"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#f)"/>
  <ellipse cx="290" cy="205" rx="470" ry="400" fill="url(#m1)"/>
  <ellipse cx="960" cy="640" rx="520" ry="430" fill="url(#m2)"/>

  <g fill="none" stroke="#ffffff" stroke-opacity="0.17" stroke-width="1.6">
    <circle cx="1010" cy="180" r="120"/>
    <circle cx="1010" cy="180" r="190"/>
    <circle cx="1010" cy="180" r="262"/>
    <circle cx="1010" cy="180" r="336"/>
  </g>

  <rect width="1200" height="800" filter="url(#susurro)" opacity=".55"/>
</svg>
