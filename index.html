<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />

    <!-- SEO -->
    <title>Kaiva Studio — Páginas web claras, rápidas y profesionales</title>
    <meta name="description" content="Diseñamos y desarrollamos páginas web profesionales para pymes colombianas. Diseño premium, SEO base, entrega rápida y precio justo." />
    <meta name="keywords" content="diseño web, desarrollo web, páginas web colombia, agencias de diseño web, kaiva studio, seo para startups" />
    <meta name="author" content="Kaiva Studio" />
    <link rel="canonical" href="https://kaivastudio.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kaivastudio.com/" />
    <meta property="og:title" content="Kaiva Studio — Páginas web claras, rápidas y profesionales" />
    <meta property="og:description" content="Diseñamos y desarrollamos páginas web profesionales para pymes colombianas. Diseño premium, SEO base, entrega rápida y precio justo." />
    <meta property="og:image" content="https://kaivastudio.com/preview.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kaivastudio.com/" />
    <meta property="twitter:title" content="Kaiva Studio — Páginas web claras, rápidas y profesionales" />
    <meta property="twitter:description" content="Diseñamos y desarrollamos páginas web profesionales para pymes colombianas. Diseño premium, SEO base, entrega rápida y precio justo." />
    <meta property="twitter:image" content="https://kaivastudio.com/preview.jpg" />

    <!-- Preload critical above-the-fold images -->
    <link rel="preload" as="image" type="image/webp" href="./KaivaTheo.webp" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="./KaivaSara.webp" fetchpriority="high" />
    <link rel="preload" as="image" type="image/webp" href="./nombre hero.webp" fetchpriority="high" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://fonts.cdnfonts.com" />

    <!-- Fonts (non-blocking) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&family=Inter+Tight:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&family=Inter+Tight:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" /></noscript>

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.cdnfonts.com" />
